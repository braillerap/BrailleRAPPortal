{% extends "base.html" %}
{% block title %}<title>System infos</title>{% endblock %}

{% block content %}
<div class="flex flex-col w-full h-full items-center">
  <h1 class="text-2xl mb-4">System information</h1>
  <div class="flex flex-col items-center min-w-full">
    
    <div class="flex flex-row gap-2 mt-4 lg:mt-8">
    
    <a class="btn btn-blue" href="{{ url_for('index') }}">Home</a>
    </div>
  </div>
  <div class="h-8 lg:h-16"></div>

  <table class="w-full lg:w-4/5  mx-auto table-auto border-2 text-left rtl:text-right border-btnlightborder">
    <thead class="bg-btnlightbackgnd">
    <tr class="px-2">
      <th>Process</th>
      <th>PID</th>    
      <th>CPU</th>
    </tr>
    </thead>
    <tbody>
      {% for p in plist %}
        <tr>
          {% for d in p %}
            <td>
            {{d}}
            </td>
          {% endfor %}
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
