# pytest.toml or .pytest.toml

[project]
name = "BrailleRAPPortal"
license = "GPL-3.0-or-later"
description = "Web captive portal for BrailleRAP software distribution"
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest]
minversion = "8.0"
addopts = ["--import-mode=importlib", "-vvvv"]
pythonpath = ["app", "tests"]
testpaths = [
    "tests", "app"
    
]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"